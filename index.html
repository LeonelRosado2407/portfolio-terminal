    <script>
      // Apply the saved terminal palette before first paint (mirrors useTheme.js)
      ;(function () {
        var themes = ['green', 'amber', 'dracula', 'light']
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        document.documentElement.dataset.theme = themes.indexOf(stored) > -1 ? stored : 'green'
      })()
    </script>
